<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 class="title">Hello, World!</h1>
    <p class="description">This is a simple HTML document.</p>
    <script>
        let heading = document.querySelector(".title");
        let paragraph = document.querySelector(".description");
        console.log(heading.textContent); // Output: Hello, World!
        console.log(paragraph.textContent); // Output: This is a simple HTML document.
    </script>
</body>
</html>
