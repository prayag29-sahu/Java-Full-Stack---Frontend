<body>
    <script>

        let a = 5
        console.log(a.__proto__); // number{}
        let b = 10
        console.log(b.__proto__); // number{}
        console.log(a.__proto__ === b.__proto__); // true
        let str = "hey i am string"
        console.log(str.__proto__); // string{}
        console.log(a.__proto__ === str.__proto__); // false
        let arr = [1,43,5,2,5]
        console.log(arr.__proto__); //  [at: ƒ, concat: ƒ, copyWithin: ƒ, fill: ƒ, find: ƒ, …]
        console.log(Array.__proto__); // ƒ () { [native code] }
        console.log(Array.prototype); //  [at: ƒ, concat: ƒ, copyWithin: ƒ, fill: ƒ, find: ƒ, …]
        

    </script>
